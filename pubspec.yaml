name: vista_movil
description: Aplicación móvil Selenne Boutique
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.0.15
  file_picker: ^8.0.0
  provider: ^6.0.0
  google_fonts: ^4.0.0
  cached_network_image: ^3.2.0
  http: ^1.2.0
  http_parser: ^4.0.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/products/
    - assets/images/products/vestidos/
    - assets/images/products/blusas/
    - assets/images/products/pantalones/
    - assets/images/products/zapatos/
    - assets/images/products/accesorios/
    - assets/images/placeholders/
    - assets/icons/
